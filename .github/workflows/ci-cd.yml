name: CI/CD Pipeline - Gestor de Pedidos

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  ci:
    name: Integración Continua (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # Frontend (Vite + React + TypeScript, gestionado con pnpm)
      # ---------------------------------------------------------------
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22: cumple el piso ^20.19 || >=22.12 de Vite 8 / TS 6.
          node-version: '22'

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          # Pin exacto: coincide con "packageManager" de frontend/package.json.
          version: 10.30.2
          run_install: false

      - name: Obtener ruta de almacenamiento de pnpm
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Configurar cache de pnpm
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Instalar dependencias del Frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint del Frontend
        working-directory: frontend
        run: pnpm lint

      - name: Build del Frontend
        working-directory: frontend
        run: pnpm build

      # ---------------------------------------------------------------
      # Backend (Node.js) — placeholder condicional.
      # No falla mientras `backend/` esté vacío (solo .gitkeep).
      # Cuando exista `backend/package.json`, descomentar la sección real.
      # ---------------------------------------------------------------
      - name: Backend (placeholder condicional)
        shell: bash
        run: |
          if [ -f "backend/package.json" ]; then
            echo "::notice::Backend detectado. Instalando y testeando..."
            cd backend
            # TODO: pnpm install --frozen-lockfile && pnpm lint && pnpm test
          else
            echo "::notice::Backend aún vacío (sin package.json). Saltando CI de backend."
          fi

  # ---------------------------------------------------------------
  # Deploy (Docker Hub + Azure) — placeholder.
  # Activarlo cuando exista backend real + Dockerfile e infraestructura.
