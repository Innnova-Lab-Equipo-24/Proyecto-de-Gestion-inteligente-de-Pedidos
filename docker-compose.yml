name: gestor-pedidos

services:
  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Base de datos futura (PostgreSQL). No arranca por defecto.
  # Usar con: docker compose --profile db up
  db:
    image: postgres:16-alpine
    profiles: ["db"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: pedidos
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
